[project]
name = "tributary-client"
version = "0.1.0"
description = "Python client for Tributary, the job queue that understands LLMs (v0)"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tributary"]
